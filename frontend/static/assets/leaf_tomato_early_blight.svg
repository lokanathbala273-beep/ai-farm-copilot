<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="lesionGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3e1b02"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Leaf Stem & Lamina -->
  <path d="M 200,360 Q 205,280 200,60 Q 320,120 310,240 Q 280,330 200,360 Z" fill="url(#leafGrad)"/>
  <path d="M 200,360 Q 195,280 200,60 Q 80,120 90,240 Q 120,330 200,360 Z" fill="url(#leafGrad)"/>
  
  <!-- Main Vein -->
  <path d="M 200,360 Q 198,210 200,60" stroke="#86efac" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 200,280 Q 240,250 270,260" stroke="#86efac" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 200,240 Q 160,210 130,220" stroke="#86efac" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 200,180 Q 245,150 280,165" stroke="#86efac" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 200,130 Q 155,110 135,120" stroke="#86efac" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Concentric Early Blight Target Spots -->
  <g transform="translate(230, 190)">
    <circle cx="0" cy="0" r="38" fill="url(#lesionGrad)"/>
    <circle cx="0" cy="0" r="28" stroke="#451a03" stroke-width="2.5" fill="none" opacity="0.9"/>
    <circle cx="0" cy="0" r="18" stroke="#78350f" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#291201"/>
  </g>

  <g transform="translate(150, 160)">
    <circle cx="0" cy="0" r="26" fill="url(#lesionGrad)"/>
    <circle cx="0" cy="0" r="18" stroke="#451a03" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="0" cy="0" r="9" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#291201"/>
  </g>

  <g transform="translate(210, 110)">
    <circle cx="0" cy="0" r="20" fill="url(#lesionGrad)"/>
    <circle cx="0" cy="0" r="12" stroke="#451a03" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#291201"/>
  </g>
  
  <text x="20" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">Specimen: Tomato Leaf with Concentric Early Blight Rings (Alternaria solani)</text>
</svg>
