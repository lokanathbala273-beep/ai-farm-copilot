      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="healthyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Healthy Turgid Foliage -->
  <path d="M 200,360 Q 210,270 200,50 Q 330,120 310,250 Q 280,330 200,360 Z" fill="url(#healthyGrad)"/>
  <path d="M 200,360 Q 190,270 200,50 Q 70,120 90,250 Q 120,330 200,360 Z" fill="url(#healthyGrad)"/>
  
  <!-- Healthy Vein Architecture -->
