  <path d="M 200,280 Q 245,245 275,255" stroke="#bbf7d0" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 200,230 Q 155,195 125,205" stroke="#bbf7d0" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 200,170 Q 250,140 280,155" stroke="#bbf7d0" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 200,120 Q 150,95 125,110" stroke="#bbf7d0" stroke-width="2.5" fill="none" opacity="0.7"/>

  <text x="20" y="380" fill="#86efac" font-family="sans-serif" font-size="12" font-weight="bold">Specimen: Completely Healthy Leaf (No Lesions / Uniform Foliar Chlorophyll)</text>
