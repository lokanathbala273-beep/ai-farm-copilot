<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Potato Leaflet -->
  <path d="M 200,350 Q 210,270 200,80 Q 300,140 280,250 Q 250,320 200,350 Z" fill="url(#leafGrad)"/>
  <path d="M 200,350 Q 190,270 200,80 Q 100,140 120,250 Q 150,320 200,350 Z" fill="url(#leafGrad)"/>
  
  <!-- Veins -->
  <path d="M 200,350 Q 198,210 200,80" stroke="#a7f3d0" stroke-width="3.5" fill="none" opacity="0.8"/>
  <path d="M 200,260 Q 235,230 260,240" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 200,210 Q 165,180 140,195" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Water-soaked necrotic black lesions (Late Blight) -->
  <path d="M 180,80 Q 220,90 240,130 Q 220,160 170,140 Q 150,110 180,80 Z" fill="#18181b" stroke="#713f12" stroke-width="3" opacity="0.95"/>
  <path d="M 250,210 Q 285,220 280,260 Q 240,270 230,230 Z" fill="#27272a" stroke="#ca8a04" stroke-width="2" opacity="0.9"/>
  <!-- White fungal downy mildew margin halo -->
  <path d="M 165,135 Q 215,165 242,135" stroke="#f1f5f9" stroke-width="2.5" stroke-dasharray="3,2" fill="none" opacity="0.85"/>

  <text x="20" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">Specimen: Potato Leaf with Water-Soaked Late Blight (Phytophthora infestans)</text>
</svg>
