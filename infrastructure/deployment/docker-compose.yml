version: '3.8'

services:
  ai-farm-copilot:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: ai-farm-copilot-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - SECRET_KEY=agritech-super-secret-jwt-key-2026-production
      - DATABASE_URL=sqlite:////app/database/farm_copilot.db
    volumes:
      - ../../uploads:/app/uploads
      - ../../database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
